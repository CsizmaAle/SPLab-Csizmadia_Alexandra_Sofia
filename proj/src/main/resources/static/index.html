<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Awareness Hub</title>
<style>
  :root { --bg: #eef1f4; --panel: #fff; --ink: #16283c; --muted: #55677a; --line: #cbd5df; --accent: #0b5c7a; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 15px/1.5 "Avenir Next", "Segoe UI", system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 20px; background: var(--ink); color: #fff; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  h2 { margin: 0 0 8px; font-size: 16px; }
  h3 { margin: 0; font-size: 15px; }
  #search { flex: 1; display: flex; gap: 8px; max-width: 560px; }
  #search input { flex: 1; }
  #results { max-height: 35vh; overflow: auto; padding: 8px 20px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #results p { display: flex; align-items: center; gap: 12px; margin: 0 0 4px; color: var(--muted); }
  #results ul { display: flex; flex-wrap: wrap; gap: 2px 12px; margin: 0; padding: 0; list-style: none; }
  #results .node { width: auto; }
  #results p button { background: none; color: var(--accent); padding: 2px 6px; }
  #status { font-size: 14px; }
  #status.DONE { color: #8fe0b0; }
  #status.FAILED { color: #ffb4ab; }
  button { padding: 6px 14px; border: 0; border-radius: 4px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  header button { background: #fff; color: var(--ink); }
  button:disabled { opacity: .5; cursor: default; }
  a { color: var(--accent); }
  :focus-visible { outline: 3px solid #e39b24; outline-offset: 2px; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(240px, 1fr) minmax(0, 2fr) minmax(240px, 1fr); }
  section { padding: 16px 20px; overflow: auto; overflow-wrap: anywhere; }
  #details { background: var(--panel); border: solid var(--line); border-width: 0 1px; }
  .empty, .meta { color: var(--muted); }
  .views button { background: none; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .views button[aria-pressed=true] { background: var(--ink); color: #fff; }
  #tree ul { margin: 0; padding: 0; list-style: none; }
  #tree ul ul { padding-left: 16px; }
  .node { display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 3px 6px; background: none; color: inherit; text-align: left; }
  .node:hover { background: #dfe6ec; }
  .node.selected { background: #d3dfe8; font-weight: 600; }
  .node::before, .type::before { content: ""; flex: none; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--type); }
  .type::before { margin-right: 6px; }
  .GROUP { --type: #b3261e; } .SOFTWARE { --type: #d97a00; } .TECHNIQUE { --type: #0b7fab; } .TACTIC { --type: #5a3e9b; }
  .NEWS { --type: #1e7a46; } .NOTE { --type: #e0b400; } .IMAGE { --type: #c2558f; } .IMPACT { --type: #16283c; }
  .text { max-width: 75ch; white-space: pre-line; }
  .sticky { max-width: 40ch; padding: 12px 16px; background: #fff3a3; box-shadow: 3px 4px 0 #e2cf62; transform: rotate(-1deg); white-space: pre-line; }
  .impact { font-size: 22px; font-weight: 600; }
  #details img { display: block; max-width: 100%; max-height: 320px; }
  .danger { background: #b3261e; }
  form { display: grid; gap: 8px; }
  .summary { max-width: 75ch; margin: 16px 0; padding: 10px 16px; border-left: 4px solid var(--accent); background: var(--bg); }
  .summary ul { margin: 4px 0 0; padding: 0; list-style: none; }
  .add { max-width: 75ch; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); }
  .add button { justify-self: start; }
  #newGroup { grid-template-columns: 1fr auto; margin-bottom: 12px; }
  label { display: grid; gap: 2px; color: var(--muted); font-size: 14px; }
  input, select, textarea { min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink); font: inherit; }
  @media (max-width: 800px) {
    body { height: auto; }
    main { grid-template-columns: 1fr; }
    #details { border-width: 1px 0; }
  }
</style>
</head>
<body>
<header>
  <h1>Cyber Awareness Hub</h1>
  <form id="search" role="search">
    <input type="search" name="q" required placeholder="Cauta grupari, malware, tehnici, notite" aria-label="Cauta">
    <select name="type" aria-label="Tip">
      <option value="">Toate</option><option value="GROUP">Grupari</option><option value="SOFTWARE">Software</option>
      <option value="TECHNIQUE">Tehnici</option><option value="NEWS">Stiri</option><option value="NOTE">Notite</option>
    </select>
  </form>
  <span id="status" role="status"></span>
  <button id="import">Importa MITRE</button>
</header>
<div id="results" hidden></div>
<main>
  <section id="tree">
    <h2>Arbore</h2>
    <p class="views"><button data-view="groups">Grupari</button> <button data-view="tactics">Tactici</button></p>
    <form id="newGroup"><input name="name" required maxlength="255" placeholder="Nume" aria-label="Numele gruparii noi"><button>Grupare noua</button></form>
    <ul id="roots"></ul>
  </section>
  <section id="details"><h2>Detalii</h2><p class="empty">Alege un nod din arbore.</p></section>
  <section id="news"><h2>Stiri</h2><p class="empty">Nicio stire inca.</p></section>
</main>
<template id="addForm">
  <form class="add">
    <h3>Adauga la acest nod</h3>
    <label>Tip <select name="type"></select></label>
    <label>Nume <input name="name" required maxlength="255"></label>
    <label>Text <textarea name="text" rows="3" maxlength="20000"></textarea></label>
    <label>Link sau adresa imaginii <input name="url" type="url" maxlength="255"></label>
    <label>Valoare <input name="value" type="number" step="any"></label>
    <button>Adauga</button>
  </form>
</template>
<script>
const $ = id => document.getElementById(id);
const el = (tag, props, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const TYPES = { GROUP: 'Grupare', SOFTWARE: 'Software', TECHNIQUE: 'Tehnica', TACTIC: 'Tactica', NEWS: 'Stire', NOTE: 'Notita', IMAGE: 'Imagine', IMPACT: 'Impact' };
const NAMES = { GROUP: ['grupare', 'grupari'], SOFTWARE: ['software', 'software'], TECHNIQUE: ['tehnica', 'tehnici'], TACTIC: ['tactica', 'tactici'],
  NEWS: ['stire', 'stiri'], NOTE: ['notita', 'notite'], IMAGE: ['imagine', 'imagini'], IMPACT: ['impact', 'impacturi'] };
// "1 tehnica", "5 tehnici", "25 de tehnici", "105 tehnici"
const count = (n, [one, many]) => n === 1 ? `1 ${one}` : `${n} ${n % 100 >= 20 || n >= 100 && n % 100 === 0 ? 'de ' : ''}${many}`;
let view, selected;

function say(text, status) {
  $('status').className = status;
  $('status').textContent = text;
}
addEventListener('unhandledrejection', e => say('Eroare: ' + e.reason.message, 'FAILED'));

async function api(url, method = 'GET', body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
  // detail = motivul trimis de server (ex. 409), daca exista
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail ?? `${url}: ${r.status}`);
  return r.status === 204 ? null : r.json();
}

// campurile goale devin null, valoarea devine numar
const fields = form => Object.fromEntries([...new FormData(form)].map(([k, v]) => [k, v === '' ? null : k === 'value' ? Number(v) : v]));

// porneste o comanda asincrona si asteapta pana nu mai e PENDING
async function track(url, show) {
  try {
    show({ status: 'PENDING' });
    const { requestId } = await api(url, 'POST');
    let s;
    while ((s = await api('/requests/' + requestId)).status === 'PENDING') await new Promise(r => setTimeout(r, 1000));
    show(s);
  } catch (e) { show({ status: 'FAILED', error: e.message }); }
}

$('import').onclick = () => track('/import/mitre', s => {
  $('import').disabled = s.status === 'PENDING';
  say({ PENDING: 'Se importa MITRE...', FAILED: 'Import esuat: ' + s.error,
    DONE: `Import gata: ${s.result?.nodes} noduri, ${s.result?.relations} relatii` }[s.status], s.status);
  if (s.status === 'DONE') loadTree(view);
});

async function loadTree(v) {
  view = v;
  if (selected) summary(selected); // summary-ul depinde de vedere
  document.querySelectorAll('[data-view]').forEach(b => b.ariaPressed = b.dataset.view === v);
  const roots = await api('/tree/' + v);
  if (view !== v) return; // intre timp s-a ales alta vedere
  $('roots').replaceChildren(...roots.length ? roots.map(item) : [el('li', { className: 'empty', textContent: 'Arborele apare aici dupa import.' })]);
}

function item(n) {
  const button = el('button', { className: 'node ' + n.type, title: TYPES[n.type], textContent: n.name, ariaExpanded: false });
  const li = el('li', {}, button);
  button.dataset.id = n.id;
  button.onclick = () => {
    select(n.id);
    const open = li.querySelector('ul');
    if (!open) return expand(li, n.id);
    button.ariaExpanded = false;
    open.remove();
  };
  return li;
}

async function expand(li, id) {
  li.querySelector('ul')?.remove();
  li.firstChild.ariaExpanded = true;
  const ul = li.appendChild(el('ul'));
  ul.append(...(await api(`/tree/${view}/${id}/children`)).map(item));
}

// reincarca copiii nodului oriunde apare in arbore
const refresh = id => document.querySelectorAll(`.node[data-id="${id}"]`).forEach(b => expand(b.parentElement, id));

async function select(id) {
  selected = id;
  document.querySelectorAll('.node').forEach(b => b.classList.toggle('selected', b.dataset.id == id));
  const n = await api('/nodes/' + id);
  if (selected !== id) return; // intre timp s-a ales alt nod
  const web = /^https?:/i.test(n.url); // doar http(s), ca un url javascript: sa nu fie clicabil
  const form = $('addForm').content.firstElementChild.cloneNode(true);
  form.elements.type.append(...['NOTE', 'IMPACT', 'IMAGE', 'NEWS', 'SOFTWARE', 'TECHNIQUE'].map(t => el('option', { value: t, textContent: TYPES[t] })));
  form.onsubmit = async e => {
    e.preventDefault();
    const c = await api(`/nodes/${id}/children`, 'POST', fields(form));
    form.reset();
    say('Adaugat: ' + c.name, 'DONE');
    refresh(id);
    summary(id);
  };
  const del = el('button', { className: 'danger', textContent: 'Sterge' });
  del.onclick = async () => {
    if (!confirm(`Stergi "${n.name}"?`)) return;
    await api('/nodes/' + id, 'DELETE');
    document.querySelectorAll(`.node[data-id="${id}"]`).forEach(b => b.parentElement.remove());
    $('details').replaceChildren(el('h2', { textContent: 'Detalii' }), el('p', { className: 'empty', textContent: 'Alege un nod din arbore.' }));
    say('Sters: ' + n.name, 'DONE');
  };
  $('details').replaceChildren(
    el('h2', { textContent: n.name }),
    el('p', { className: 'meta' }, el('span', { className: 'type ' + n.type, textContent: TYPES[n.type] }), `${n.externalId ? ' ' + n.externalId : ''}, sursa ${n.source}`),
    n.type === 'IMPACT' && n.value != null ? el('p', { className: 'impact', textContent: n.value.toLocaleString('ro-RO') }) : '',
    n.text ? el('p', { className: n.type === 'NOTE' ? 'sticky' : 'text', textContent: n.text }) : '',
    n.type === 'IMAGE' && web ? el('img', { src: n.url, alt: n.name }) : '',
    web ? el('p', {}, el('a', { href: n.url, target: '_blank', rel: 'noopener', textContent: n.url })) : '',
    el('div', { className: 'summary' }),
    n.source === 'CUSTOM' ? del : '',
    form);
  summary(id);
}

async function summary(id) {
  const s = await api(`/nodes/${id}/summary?view=${view}`);
  const box = document.querySelector('#details .summary');
  if (selected !== id || !box) return;
  const rows = Object.entries(s.counts).map(([t, n]) => el('li', { className: 'type ' + t, textContent: count(n, NAMES[t]) }));
  if (s.impactTotal > 0) rows.push(el('li', { textContent: 'Impact total: ' + s.impactTotal.toLocaleString('ro-RO') }));
  box.replaceChildren(el('h3', { textContent: 'Summary' }),
    rows.length ? el('ul', {}, ...rows) : el('p', { className: 'empty', textContent: 'Nimic sub acest nod.' }));
}

$('search').onsubmit = async e => {
  e.preventDefault();
  const { q, type } = Object.fromEntries(new FormData(e.target));
  say('', '');
  const found = await api('/search?' + new URLSearchParams(type ? { q, type } : { q }));
  const close = el('button', { textContent: 'Inchide', onclick: () => $('results').hidden = true });
  $('results').replaceChildren(
    el('p', {}, `${count(found.length, ['rezultat', 'rezultate'])} pentru "${q.trim()}"${found.length === 50 ? ' (primele 50)' : ''}`, close),
    el('ul', {}, ...found.map(n => {
      const b = el('button', { className: 'node ' + n.type, title: TYPES[n.type], textContent: n.name, onclick: () => select(n.id) });
      b.dataset.id = n.id;
      return el('li', {}, b);
    })));
  $('results').hidden = false;
};

$('newGroup').onsubmit = async e => {
  e.preventDefault();
  const g = await api('/nodes', 'POST', { ...fields(e.target), type: 'GROUP' });
  e.target.reset();
  say('Adaugat: ' + g.name, 'DONE');
  await loadTree('groups');
  select(g.id);
};

document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => loadTree(b.dataset.view));
loadTree('groups');
</script>
</body>
</html>
